# Quản Lý Rau - lint rules (flutter_lints + small senior-friendly project rules)
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    prefer_single_quotes: true
    sort_child_properties_last: true
    use_full_hex_values_for_flutter_colors: true
    avoid_print: true
    unawaited_futures: false
    # Pure style/perf hint: firing on ~35 legitimately non-const widget
    # constructions would drown out real problems in `flutter analyze`.
    prefer_const_constructors: false

analyzer:
  errors:
    deprecated_member_use: ignore
  exclude:
    - build/**
    - android/**
