org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Fail fast with a clear message instead of invoking the broken sdkmanager
# auto-downloader when an SDK package is missing.
android.builder.sdkDownload=false
# Pub cache lives on C: while this project lives on D:. Kotlin's incremental
# compilation cache cannot relativize paths across different drives and crashes
# ("this and base files have different roots"), so incremental compilation is
# disabled. Builds are slightly slower but reliable.
kotlin.incremental=false
